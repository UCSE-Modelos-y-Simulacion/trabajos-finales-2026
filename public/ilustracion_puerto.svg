<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hdr4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f3763"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="arr4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect width="860" height="48" rx="14" fill="url(#hdr4)"/>
  <text x="430" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">PLAYA DE TRANSFERENCIA PORTUARIA Y GRÚAS PÓRTICO RTG (MODELO M/M/c)</text>

  <!-- Arribo Camiones -->
  <rect x="25" y="120" width="165" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="107" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1">ARRIBO CAMIONES</text>
  <text x="107" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f3763">λ = 28 cam/hora</text>
  <text x="107" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Proceso de Poisson</text>
  <text x="107" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Smart-Gate: -25% (λ' = 21/h)</text>

  <line x1="190" y1="180" x2="245" y2="180" stroke="#0284c7" stroke-width="3" marker-end="url(#arr4)"/>

  <!-- Cola de Playa -->
  <rect x="250" y="105" width="205" height="150" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="352" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#854d0e">FILA EN PLAYA LOGÍSTICA</text>
  <text x="352" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#be123c">Actual: ~50% espera &gt; 6 min</text>
  <text x="352" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#713f12">SLA Autoridad Portuaria:</text>
  <text x="352" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f3763">95% espere &lt; 6 minutos</text>
  <text x="352" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#854d0e">Carril Único de Llamado (FIFO)</text>

  <line x1="455" y1="145" x2="515" y2="100" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr4)"/>
  <line x1="455" y1="180" x2="515" y2="180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr4)"/>
  <line x1="455" y1="215" x2="515" y2="260" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arr4)"/>

  <!-- Gruas Portico -->
  <rect x="520" y="70" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Grúa Pórtico RTG #1</text>
  <text x="615" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0284c7">Media = 7,5 min (μ = 8 cam/h)</text>

  <rect x="520" y="150" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Grúas Pórtico RTG #2 ... #c</text>
  <text x="615" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0284c7">Spreader Láser: 6 min (μ' = 10/h)</text>

  <rect x="520" y="230" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Grúas Activas (c)</text>
  <text x="615" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ff007f">¿Cuántas grúas habilitar?</text>

  <line x1="710" y1="100" x2="750" y2="160" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="710" y1="180" x2="750" y2="180" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>
  <line x1="710" y1="260" x2="750" y2="200" stroke="#0284c7" stroke-width="2" marker-end="url(#arr4)"/>

  <!-- Salida Camiones -->
  <rect x="755" y="135" width="85" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="797" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">DESPACHO</text>
  <text x="797" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d">A BUQUE</text>
  <text x="797" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#166534">(Sink)</text>

  <text x="430" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#475569">Evaluación en FlexSim: Grúas actuales vs. SLA Portuario (95% &lt; 6 min) vs. Turnos Smart-Gate vs. Modernización de Spreaders</text>
</svg>

