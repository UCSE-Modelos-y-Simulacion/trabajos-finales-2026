<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f3763"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00bfff"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect width="860" height="48" rx="14" fill="url(#hdr)"/>
  <text x="430" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ESQUEMA DEL SISTEMA DE COLAS EN MOSTRADORES DE CHECK-IN (AEROPARQUE)</text>

  <!-- Source: Llegadas -->
  <rect x="30" y="135" width="150" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0369a1">ARRIBO PASAJEROS</text>
  <text x="105" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f3763">λ = 132 pas/hora</text>
  <text x="105" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Proceso de Poisson</text>
  <text x="105" y="224" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">(2,2 pasajeros/min)</text>

  <line x1="180" y1="185" x2="245" y2="185" stroke="#00bfff" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Queue: Fila Única -->
  <rect x="250" y="115" width="190" height="140" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="345" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#854d0e">COLA DE ESPERA (FIFO)</text>
  <circle cx="285" cy="178" r="12" fill="#1f3763"/>
  <circle cx="320" cy="178" r="12" fill="#1f3763"/>
  <circle cx="355" cy="178" r="12" fill="#1f3763"/>
  <circle cx="390" cy="178" r="12" fill="#00bfff"/>
  <text x="345" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#713f12">¿Fila Única o Filas Separadas?</text>
  <text x="345" y="235" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#854d0e">Dimensionamiento de Butacas</text>

  <!-- Arrows to 4 Agents -->
  <line x1="440" y1="150" x2="520" y2="90" stroke="#00bfff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="173" x2="520" y2="152" stroke="#00bfff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="197" x2="520" y2="215" stroke="#00bfff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="220" x2="520" y2="278" stroke="#00bfff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4 Agents -->
  <rect x="525" y="65" width="165" height="46" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="607" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Agente 1 (Mostrador)</text>
  <text x="607" y="102" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ff007f">μ = 40 pas/h (90 seg)</text>

  <rect x="525" y="128" width="165" height="46" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="607" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Agente 2 (Mostrador)</text>
  <text x="607" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0284c7">μ = 40 pas/h (90 seg)</text>

  <rect x="525" y="191" width="165" height="46" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="607" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Agente 3 (Mostrador)</text>
  <text x="607" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0284c7">μ = 40 pas/h (90 seg)</text>

  <rect x="525" y="254" width="165" height="46" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="607" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Agente 4 (Mostrador)</text>
  <text x="607" y="291" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0284c7">μ = 40 pas/h (90 seg)</text>

  <!-- Sink: Embarque -->
  <line x1="690" y1="88" x2="740" y2="160" stroke="#00bfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="151" x2="740" y2="175" stroke="#00bfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="214" x2="740" y2="195" stroke="#00bfff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="277" x2="740" y2="210" stroke="#00bfff" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="745" y="140" width="90" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">SALIDAS</text>
  <text x="790" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d">Pre-embarque</text>
  <text x="790" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#166534">(Sink)</text>

  <text x="430" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#475569">Comparación de escenarios en FlexSim: (1) Cola única M/M/4 vs. (2) Especiales + Check-in vs. (3) Despacho Equipaje + Cabina</text>
</svg>

