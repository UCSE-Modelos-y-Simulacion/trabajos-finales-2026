<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <defs>
    <linearGradient id="hdr3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f3763"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="860" height="360" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect width="860" height="48" rx="14" fill="url(#hdr3)"/>
  <text x="430" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">FLUJO DE ATENCIÓN EN GUARDIA DE EMERGENCIAS MÉDICAS (MODELO M/M/c)</text>

  <!-- Arribo Pacientes -->
  <rect x="25" y="120" width="165" height="120" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="107" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0369a1">INGRESO PACIENTES</text>
  <text x="107" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f3763">λ = 36 pac/hora</text>
  <text x="107" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Arribo Aleatorio Poisson</text>
  <text x="107" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#0d9488">Tele-Triage: -25% (λ' = 27/h)</text>

  <line x1="190" y1="180" x2="245" y2="180" stroke="#0d9488" stroke-width="3" marker-end="url(#arr3)"/>

  <!-- Sala de Espera -->
  <rect x="250" y="105" width="205" height="150" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="352" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#854d0e">SALA DE ESPERA GUARDIA</text>
  <text x="352" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#be123c">Actual: ~43% espera en fila</text>
  <text x="352" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#713f12">Meta Ministerio de Salud:</text>
  <text x="352" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f3763">95% espere &lt; 3 minutos</text>
  <text x="352" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#854d0e">Fila Única Común (FIFO)</text>

  <line x1="455" y1="145" x2="515" y2="100" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr3)"/>
  <line x1="455" y1="180" x2="515" y2="180" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr3)"/>
  <line x1="455" y1="215" x2="515" y2="260" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- Boxes Medicos -->
  <rect x="520" y="70" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Box Médico #1</text>
  <text x="615" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0d9488">Media = 12 min (μ = 5 pac/h)</text>

  <rect x="520" y="150" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Box Médico #2 ... #c</text>
  <text x="615" y="194" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0d9488">Con Historia IA: 10 min (μ' = 6/h)</text>

  <rect x="520" y="230" width="190" height="58" rx="8" fill="#ffffff" stroke="#1f3763" stroke-width="2"/>
  <text x="615" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f3763">Dotación a Dimensionar (c)</text>
  <text x="615" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ff007f">¿Cuántos médicos por turno?</text>

  <line x1="710" y1="100" x2="750" y2="160" stroke="#0d9488" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="710" y1="180" x2="750" y2="180" stroke="#0d9488" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="710" y1="260" x2="750" y2="200" stroke="#0d9488" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Alta / Internacion -->
  <rect x="755" y="135" width="85" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="797" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#166534">ALTA /</text>
  <text x="797" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d">DERIVACIÓN</text>
  <text x="797" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#166534">(Sink)</text>

  <text x="430" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-style="italic" fill="#475569">Evaluación en FlexSim: Dotación actual vs. Meta SLA (95% &lt; 3 min) vs. Tele-Triage (-25% demanda) vs. IA Clínica (μ' = 6 pac/h)</text>
</svg>

